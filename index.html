<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Primaria Studio</title>
<style>
/* Estúdio de peças: coluna de conversa à esquerda, peça em tamanho real à direita. Visual único (claro), da própria marca. */
:root {
  --paper: #ffffff; --ink: #000000; --graphite: #2e2b2a; --red: #cc1410;
  --line: #e4e2df; --mute: #6d6865; --soft: #f5f4f2;
  --sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.45 var(--sans); }
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.cap-label, .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); background: var(--paper); z-index: 5; }
header .brand { display: flex; align-items: center; gap: 14px; }
header img { height: 30px; width: auto; }
header .eyebrow { color: var(--mute); }
#status { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; padding: 6px 10px; border: 1px solid var(--line); }
#status[data-on="true"] { color: var(--ink); border-color: var(--ink); }
#status[data-on="false"] { color: var(--mute); }

main { display: grid; grid-template-columns: minmax(320px, 440px) 1fr; min-height: 0; overflow: hidden; }
.side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.block { padding: 18px 24px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--ink); }
.seg button { border: 0; background: var(--paper); padding: 11px 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
#imgState { color: var(--mute); font-size: 12px; }
#thumbs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.thumb { padding: 0; border: 2px solid transparent; background: var(--soft); aspect-ratio: 1; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.1); display: block; }
.thumb[aria-pressed="true"] { border-color: var(--red); }
.thumb[aria-pressed="true"] img { filter: none; }
.upload { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; border-bottom: 1px solid var(--ink); padding-bottom: 2px; cursor: pointer; }
.upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }

#log { flex: 1; overflow-y: auto; min-height: 0; padding: 18px 24px; display: flex; flex-direction: column; gap: 12px; min-height: 180px; }
.msg { max-width: 92%; line-height: 1.5; }
.msg.you { align-self: flex-end; background: var(--ink); color: var(--paper); padding: 10px 14px; }
.msg.studio { align-self: flex-start; border-left: 2px solid var(--ink); padding: 2px 0 2px 12px; color: var(--graphite); }
.msg small { display: block; color: var(--mute); font-size: 12px; margin-top: 4px; }
.msg .cap { margin-top: 10px; background: var(--soft); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.msg .cap span { font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mute); }
.msg .cap p { margin: 0; }
.msg .cap button { align-self: flex-start; background: none; border: 0; padding: 0; font-size: 12px; font-weight: 700; text-decoration: underline; }
.dots::after { content: '…'; animation: blink 1s steps(3) infinite; }
@keyframes blink { 50% { opacity: 0.2; } }
@media (prefers-reduced-motion: reduce) { .dots::after { animation: none; } }

.compose { padding: 16px 24px 20px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; background: var(--paper); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--paper); padding: 6px 10px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
.chips button:hover { border-color: var(--ink); }
#form { display: flex; gap: 8px; align-items: stretch; }
#idea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--ink); padding: 12px; min-height: 72px; background: var(--paper); }
#go { background: var(--red); color: #fff; border: 0; padding: 0 20px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; font-size: 12px; }
#go:disabled, #vary:disabled { opacity: 0.5; cursor: wait; }
#pwdRow { display: flex; gap: 8px; align-items: center; font-size: 12px; }
#pwd { border: 1px solid var(--line); padding: 6px 8px; flex: 1; }

.stage { overflow-y: auto; padding: 28px; display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 28px; align-content: start; min-width: 0; background: var(--soft); }
.canvasWrap { position: relative; display: flex; flex-direction: column; gap: 14px; align-items: center; min-width: 0; }
#canvas { width: auto; height: min(78vh, 900px); max-width: 100%; background: #fff; box-shadow: 0 1px 0 var(--line), 0 18px 40px rgba(0,0,0,0.12); aspect-ratio: 1080 / 1350; object-fit: contain; }
#empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); }
#actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
#actions button { border: 1px solid var(--ink); background: var(--paper); padding: 10px 16px; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
#actions #approve { background: var(--ink); color: var(--paper); }
#actions #reject { color: var(--red); border-color: var(--red); }
#reasonRow { display: flex; gap: 8px; width: min(520px, 100%); }
#reason { flex: 1; min-width: 0; border: 1px solid var(--red); padding: 8px 10px; }
#reasonOk { background: var(--red); color: #fff; border: 0; padding: 0 14px; font-weight: 700; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }

.panel { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.panel h2 { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
#editor { display: flex; flex-direction: column; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 11px; color: var(--mute); letter-spacing: 0.08em; text-transform: uppercase; }
.field textarea { border: 1px solid var(--line); background: var(--paper); padding: 8px; resize: vertical; text-transform: uppercase; }
#histCount { font-size: 12px; color: var(--mute); }
#history { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.hist { position: relative; }
.hist img { width: 100%; display: block; }
.hist span { position: absolute; left: 4px; bottom: 4px; font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 5px; background: var(--ink); color: #fff; }
.hist[data-v="reprovado"] img { opacity: 0.45; }
.hist[data-v="reprovado"] span { background: var(--red); }

@media (max-width: 1100px) { .stage { grid-template-columns: 1fr; } }
@media (max-width: 820px) {
  .app { height: auto; min-height: 100%; }
  main { grid-template-columns: 1fr; overflow: visible; }
  .stage { overflow: visible; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); }
  #log { max-height: 320px; }
  header { padding: 12px 16px; }
  .block, #log, .compose { padding-left: 16px; padding-right: 16px; }
  .stage { padding: 16px; }
  #canvas { height: auto; width: 100%; }
  #thumbs { grid-template-columns: repeat(5, minmax(0, 1fr)); }
}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <img src="assets/logos/preto.png" alt="Primaria">
      <span class="eyebrow">Studio</span>
    </div>
    <span id="status" data-on="false">Conectando</span>
  </header>
  <main>
    <section class="side" aria-label="Criação">
      <div class="block">
        <div class="seg" role="group" aria-label="Formato">
          <button type="button" data-format="feed" aria-pressed="true">Post 4:5</button>
          <button type="button" data-format="story" aria-pressed="false">Story 9:16</button>
        </div>
        <div class="row"><span class="eyebrow">Imagem</span><span id="imgState">Imagem automática</span></div>
        <div id="thumbs"></div>
        <label class="upload" for="upload">Enviar foto<input id="upload" type="file" accept="image/*" multiple></label>
      </div>
      <div id="log" aria-live="polite"></div>
      <div class="compose">
        <div class="chips" aria-label="Ideias rápidas">
          <button type="button" data-idea="Contagem regressiva: faltam 7 dias, clima escuro">Contagem</button>
          <button type="button" data-idea="Coming soon com rostos em meio-tom">Coming soon</button>
          <button type="button" data-idea="Line-up da música com movimento">Line-up</button>
          <button type="button" data-idea="Post de conceito com a frase “PROTECT THE ORIGINAL ONE.”">Frase</button>
          <button type="button" data-idea="Informações do evento: data, horário e local">Informações</button>
          <button type="button" data-idea="Apresentar as marcas da curadoria">Marcas</button>
        </div>
        <form id="form">
          <label class="eyebrow" for="idea" hidden>Ideia do post</label>
          <textarea id="idea" placeholder="Descreva a ideia do post. Frase exata entre aspas." aria-label="Ideia do post"></textarea>
          <button id="go" type="submit">Gerar</button>
        </form>
        <div id="pwdRow" hidden><label for="pwd">Senha da equipe</label><input id="pwd" type="password" autocomplete="current-password"></div>
      </div>
    </section>

    <section class="stage" aria-label="Peça">
      <div class="canvasWrap">
        <canvas id="canvas" width="1080" height="1350" aria-label="Prévia da peça"></canvas>
        <div id="empty">Sua peça aparece aqui</div>
        <div id="actions" hidden>
          <button id="vary" type="button">Variar</button>
          <button id="download" type="button">Baixar PNG</button>
          <button id="approve" type="button">Aprovar</button>
          <button id="reject" type="button">Reprovar</button>
        </div>
        <div id="reasonRow" hidden>
          <input id="reason" type="text" placeholder="Por quê? Ex.: texto grande demais, efeito repetido" aria-label="Motivo da reprovação">
          <button id="reasonOk" type="button">Enviar</button>
        </div>
      </div>
      <div class="panel">
        <div id="editorWrap" hidden>
          <h2>Textos da peça</h2>
          <div id="editor"></div>
        </div>
        <div>
          <h2>Memória</h2>
          <p id="histCount">0 aprovadas · 0 reprovadas</p>
          <div id="history"></div>
        </div>
      </div>
    </section>
  </main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
